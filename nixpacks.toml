providers = ['...', 'python']

[phases.setup]
nixPkgs = ['...', 'deno', 'ffmpeg', 'python312']

[phases.install]
cmds = ['...', 'test -x /opt/venv/bin/yt-dlp', '/opt/venv/bin/yt-dlp --version', '/opt/venv/bin/yt-dlp --help | grep -q -- --js-runtimes', 'deno --version', 'ffmpeg -version']

[variables]
YT_DLP_PATH = '/opt/venv/bin/yt-dlp'
DENO_PATH = 'deno'
FFMPEG_PATH = 'ffmpeg'
NIXPACKS_PYTHON_PACKAGE_MANAGER = 'requirements'
NIXPACKS_PYTHON_VERSION = '3.12'

[start]
cmd = 'node src/index.js'
